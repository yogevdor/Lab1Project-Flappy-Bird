name: Build web demo and deploy to GitHub Pages

on:
  push:
    branches: [web-demo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web-demo branch (harness, stubs, generated HDL)
        uses: actions/checkout@v4

      - name: Checkout the game RTL from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      # Pinned versions: build.sh post-processes the C++ that Verilator generates (tools/slim_snapshot.py).
      - name: Install Verilator 5.48.0
        run: |
          chmod +x build.sh tools/*.sh
          echo "VERILATOR=$(tools/install_verilator_pip.sh "$RUNNER_TEMP/verilator")" >> "$GITHUB_ENV"

      - name: Setup Emscripten 3.1.64
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Build WebAssembly game
        run: ./build.sh web main-src

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
